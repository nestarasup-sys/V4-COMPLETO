name: Desktop smoke and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: xvfb-run -a npm run ui-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-smoke-screenshots
          path: artifacts/ui-*.png
          if-no-files-found: ignore
