name: Desktop smoke and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Electron end-to-end and responsive screenshots
        run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: gacha-v4-electron-screenshots
          path: artifacts/electron-*.png
          if-no-files-found: error
